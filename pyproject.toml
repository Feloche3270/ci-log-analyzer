[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ci-log-analyzer"
requires-python = ">= 3.12"
pytest = ">= 9"
version = "0.1.0"
description = "Command line tool that summarizes JUnit XML results and build logs from CI in the terminal, a Markdown report and a JSON report."
readme = "README.md"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest >= 9", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_log_analyzer"]

[tool.ruff]
line-length = 88 
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","UP","B"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]